[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-rag"
version = "0.1.0"
description = "Production-oriented knowledge ingestion, retrieval, and evaluation workload"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "pydantic>=2.13,<3",
  "pypdf>=6.0,<7",
  "python-docx>=1.2,<2"
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "ruff>=0.16,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["knowledge_rag"]