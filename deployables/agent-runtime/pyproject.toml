[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "agent-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.140.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "mcp>=1.27,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
[tool.ruff]
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["agent_runtime"]
