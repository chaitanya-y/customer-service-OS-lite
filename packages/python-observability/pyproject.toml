[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cso-observability"
version = "0.1.0"
description = "Content-free local OpenTelemetry boundaries for CSO Python services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["cso_observability"]

[tool.ruff]
target-version = "py312"
