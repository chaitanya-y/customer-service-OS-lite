        {
          "uid": "cso-model-safety-rate",
          "title": "Model guard or failure event rate",
          "condition": "C",
          "for": "10m",
          "noDataState": "OK",
          "execErrState": "Error",
          "data": [
            {
              "refId": "A",
              "queryType": "",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "instant": true,
                "range": false,
                "expr": "(sum(increase(cso_operation_completed_total{service_name=\"agent-runtime\",operation=~\"model[.]refund_(answer|intent)\",outcome=~\"model_error|guard_rejected\"}[15m])) / sum(increase(cso_operation_completed_total{service_name=\"agent-runtime\",operation=~\"model[.]refund_(answer|intent)\"}[15m]))) > 0.20 and sum(increase(cso_operation_completed_total{service_name=\"agent-runtime\",operation=~\"model[.]refund_(answer|intent)\"}[15m])) >= 20",
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "A",
                "type": "reduce",
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": []
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ],
                "reducer": "last",
                "refId": "B",
                "settings": {
                  "mode": "dropNN"
                }
              }
            },
            {
              "refId": "C",
              "queryType": "",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "B",
                "type": "threshold",
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ],
                "refId": "C"
              }
